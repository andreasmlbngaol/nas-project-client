product:
  type: kmp/lib
  platforms: [ jvm, android, wasmJs ]

dependencies:
  - org.jetbrains.compose.runtime:runtime:1.11.0
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.kotlinx.serialization.json

dependencies@jvm:
  - $libs.ktor.client.cio

dependencies@android:
  - $libs.ktor.client.okhttp
  - $libs.kotlinx.coroutines.android

dependencies@wasmJs:
  - $libs.ktor.client.js
  - $libs.kotlinx.browser

settings:
  kotlin:
    serialization: json
  compose:
    enabled: true
    resources:
      packageName: id.andreasmlbngaol.nas_project.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
